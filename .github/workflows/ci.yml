name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-debug
            cc: gcc
            cxx: g++
            build_type: Debug
            sanitize: ""
          - name: gcc-release
            cc: gcc
            cxx: g++
            build_type: Release
            sanitize: ""
          - name: clang-asan
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitize: address
          - name: clang-tsan
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitize: thread
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y liburing-dev ninja-build
      - name: configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DLNFS_SANITIZE=${{ matrix.sanitize }}
      - name: build
        run: ninja -C build
      - name: test
        run: ctest --test-dir build --output-on-failure --timeout 300
      - name: bench smoke (no threshold gate in CI)
        if: matrix.build_type == 'Release'
        run: |
          ./build/bench_nullrpc 1 4 10000 32 || true
          ./build/bench_echo 1 4 10000 32 128 || true

  # M1 read-only acceptance (development plan §3.5). The runner is a root VM with a
  # kernel NFS client, so both halves run: userspace-client loopback (incl. ASAN
  # soak) and a real `mount -o vers=3` with ls -lR / cat / md5sum -c / bigdir /
  # cthon04 basic read-only subset.
  m1-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y liburing-dev ninja-build nfs-common
      - name: loopback acceptance (Release + ASAN userspace client, 100k bigdir)
        run: scripts/accept_m1_local.sh 60 100000
      - name: real-mount acceptance (kernel client + cthon read-only subset)
        run: scripts/accept_m1_vm.sh 100000

  # Phase-2 read-write acceptance (development plan §4.6): loopback rw workload with
  # kill -9 crash recovery, 10k-connection storm and ASAN soak; then a real rw mount
  # running cthon04 basic/general/special and a short fsx. Overnight fsx (>=12h) runs
  # from the same script with FSX_OPS raised (nightly, not per-PR).
  m2-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y liburing-dev ninja-build nfs-common libtirpc-dev
      - name: loopback rw acceptance (Release + ASAN, crash recovery, connstorm)
        run: scripts/accept_m2_local.sh 60
      - name: real-mount rw acceptance (cthon b/g/s + fsx 50k ops + kill -9 recovery)
        run: scripts/accept_m2_vm.sh 50000

  # Phase-3 v4.1 read-only acceptance (development plan §5.4): loopback userspace v4.1
  # client walk + v3/v4 dual-read consistency + pynfs session groups, then a real
  # vers=4.1,ro mount with a v3/v4 dual-mount comparison on the runner VM.
  m3-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev ninja-build nfs-common python3-ply
      - name: loopback v4.1 acceptance (v4walk + dual-read + pynfs sessions + ASAN)
        run: scripts/accept_m3_local.sh
      - name: real-mount acceptance (vers=4.1,ro + v3/v4 dual mount)
        run: scripts/accept_m3_vm.sh

  # Phase-4 v4.1 read-write + full state acceptance (development plan §6.3): loopback
  # userspace v4.1 rw client, restart reclaim, lease/courtesy reclaim, ctl state dump,
  # pynfs open/rename/verify/courteous groups (+ the phase-3 groups), then a real
  # vers=4.1 rw mount on the runner VM with cthon b/g/s, fsx, kill -9 reclaim and
  # v3/v4 mixed writes.
  m4-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev ninja-build nfs-common python3-ply
      - name: loopback v4.1 rw acceptance (v4rw + reclaim + courtesy + pynfs + ASAN)
        run: scripts/accept_m4_local.sh
      - name: real-mount acceptance (vers=4.1 rw: cthon + fsx + restart reclaim)
        run: scripts/accept_m4_vm.sh 50000

  # Phase-5 v4.1 locks + security acceptance (development plan §7): loopback userspace
  # v4lock scenario + pynfs lock/secinfo/courteous groups + the M4 rw/reclaim/courtesy
  # phases; then a real vers=4.1 mount on the runner VM with cthon lock group and kernel
  # POSIX byte-range locking.
  m5-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev ninja-build nfs-common python3-ply
      - name: loopback v4.1 lock acceptance (v4lock + pynfs locks/secinfo + rw/reclaim + ASAN)
        run: scripts/accept_m5_local.sh
      - name: real-mount acceptance (vers=4.1: cthon lock group + kernel byte-range locks)
        run: scripts/accept_m5_vm.sh 50000

  fuzz-short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y liburing-dev ninja-build clang
      - name: configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DLNFS_BUILD_FUZZ=ON
      - name: build
        run: ninja -C build fuzz_handle_request
      - name: fuzz 120s
        run: mkdir -p corpus && ./build/fuzz_handle_request -max_total_time=120 corpus

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          git ls-files 'src/**/*.hpp' 'src/**/*.cpp' 'tests/*.cpp' 'bench/*' 'fuzz/*.cpp' \
            | xargs clang-format --dry-run -Werror || {
              echo "::warning::formatting drift (non-blocking during phase 0)"; true; }
