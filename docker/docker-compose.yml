# lightnfs — single-gateway deployment of the local backend in a container.
#
#   cd docker
#   mkdir -p export && sudo chown 2049:2049 export     # or: echo LNFS_UID=$(id -u) > .env
#   docker compose up -d --build
#   docker compose exec lightnfs lightnfs-ctl status
#   mount -t nfs -o vers=4.1 <host>:/export /mnt
#   mount -t nfs -o vers=3,port=2049,mountport=20048 <host>:/export /mnt
#
# .env / environment:
#   LNFS_EXPORT  host directory to export (default ./export)
#   LNFS_UID/GID uid/gid the server runs as (default 2049): match the export's owner for
#                read-write exports (see docker/entrypoint.sh)
#   LNFS_IMAGE   image tag (default lightnfs:1.3.0)
#
# The service publishes the NFS ports on the bridge network (lightnfs is TCP-only, so
# NAT works and clients keep their source address for the export ACL).  For a
# production gateway `network_mode: host` is simpler — drop the `ports:` block and
# clients see the host address directly; the state volume, capabilities and the
# read-only root stay the same.

name: lightnfs

services:
  lightnfs:
    image: ${LNFS_IMAGE:-lightnfs:1.3.0}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      LNFS_UID: ${LNFS_UID:-2049}
      LNFS_GID: ${LNFS_GID:-2049}
    ports:
      - "2049:2049"               # NFSv3 + NFSv4.1/4.2
      - "20048:20048"             # MOUNTv3
      - "127.0.0.1:9100:9100"     # Prometheus metrics (loopback only)
    # network_mode: host
    volumes:
      - lightnfs-state:/var/lib/lightnfs
      - ${LNFS_EXPORT:-./export}:/export
      - ./lightnfs.toml:/etc/lightnfs/lightnfs.toml:ro
    # Least privilege (packaging/systemd/lightnfs.service equivalent): the entrypoint
    # uses CHOWN/FOWNER/SETUID/SETGID to prepare the state dir and drop to LNFS_UID; the
    # server itself keeps only DAC_READ_SEARCH (kernel filehandles) + NET_BIND_SERVICE.
    # DAC_OVERRIDE stays for container root only: the healthcheck and `docker compose
    # exec lightnfs lightnfs-ctl …` connect to the 0600 ctl socket owned by LNFS_UID.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - DAC_READ_SEARCH
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    stop_grace_period: 30s        # SIGTERM: drains, clients reclaim within the grace period
    healthcheck:
      test: ["CMD", "lightnfs-ctl", "ping"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  lightnfs-state:
